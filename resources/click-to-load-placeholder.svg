<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="150" fill="url(#bg)" rx="8"/>
  <!-- Image icon -->
  <g transform="translate(70, 35)" fill="#9ca3af">
    <!-- Mountain/image frame -->
    <rect x="0" y="0" width="60" height="45" rx="4" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="18" cy="15" r="6" fill="#9ca3af"/>
    <polygon points="8,38 25,22 35,32 45,20 52,38" fill="#9ca3af"/>
  </g>
  <!-- Click indicator -->
  <g transform="translate(85, 90)" fill="#6b7280">
    <!-- Hand/pointer -->
    <path d="M15 0 L15 18 L10 14 L6 22 L3 20 L7 12 L2 10 L15 0Z" fill="#6b7280"/>
  </g>
  <!-- Text -->
  <text x="100" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">Click to load</text>
</svg>
