<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferro — Connection Error</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --text-color: #1e293b;
      --reason-bg: #fee2e2;
      --reason-text: #991b1b;
      --button-bg: #3b82f6;
      --button-text: white;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --text-color: #f1f5f9;
        --reason-bg: rgba(127, 29, 29, 0.5);
        --reason-text: #fecaca;
        --button-bg: #3b82f6;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .container {
      max-width: 480px;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      display: inline-block;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    p {
      opacity: 0.8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .reason-box {
      background: var(--reason-bg);
      color: var(--reason-text);
      padding: 1rem;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      display: inline-block;
      max-width: 100%;
      word-break: break-all;
    }

    button {
      background: var(--button-bg);
      color: var(--button-text);
      border: none;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 99px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">🦖</div>
    <h1>Connection Error</h1>
    <p>Ferro couldn't establish a connection to the server. Please check your internet connection and try again.</p>

    <div class="reason-box">${reason}</div>

    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>

</html>
