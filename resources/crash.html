<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferro — Page Crashed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { opacity: 0.7; margin-bottom: 1.5rem; }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    details { margin-top: 2rem; text-align: left; max-width: 600px; width: 100%; }
    summary { cursor: pointer; opacity: 0.6; font-size: 0.875rem; }
    pre {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.75rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    @media (prefers-color-scheme: light) {
      body { background: #f8fafc; color: #1e293b; }
      pre { background: #e2e8f0; }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #f1f5f9; }
      pre { background: #1e293b; }
    }
  </style>
</head>
<body>
  <div class="icon">💥</div>
  <h1>This page crashed</h1>
  <p>Something went wrong while loading this page.</p>
  <button onclick="location.reload()">Reload Page</button>
  <details>
    <summary>Technical details</summary>
    <pre>${details}</pre>
  </details>
</body>
</html>
