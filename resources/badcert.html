<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferro — Security Warning</title>
  <style>
    :root {
      --bg-color: #fff7ed;
      --text-color: #431407;
      --card-bg: #ffedd5;
      --button-primary-bg: #ea580c;
      --button-primary-text: white;
      --button-secondary-hover: rgba(67, 20, 7, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #2a1205;
        --text-color: #fdba74;
        --card-bg: #431407;
        --button-primary-bg: #fdba74;
        --button-primary-text: #431407;
        --button-secondary-hover: rgba(253, 186, 116, 0.1);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .container {
      max-width: 500px;
      width: 100%;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .message {
      opacity: 0.9;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .technical-details {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.85rem;
      margin-bottom: 2rem;
      text-align: left;
      word-break: break-all;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    button {
      font-size: 1rem;
      font-weight: 600;
      padding: 12px 32px;
      border-radius: 99px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    #leave {
      background: var(--button-primary-bg);
      color: var(--button-primary-text);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    #leave:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    #allow {
      background: transparent;
      color: inherit;
      padding: 8px 16px;
      font-size: 0.9rem;
      text-decoration: underline;
      opacity: 0.8;
    }

    #allow:hover {
      opacity: 1;
      background: var(--button-secondary-hover);
      text-decoration: none;
    }

    #bytes {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">⚠️</div>
    <h1>Your connection is not secure</h1>
    <p class="message">Attackers might be trying to steal your information from this site (for example, passwords,
      messages, or credit cards).</p>

    <div class="technical-details">
      <strong>Error:</strong> ${reason}
    </div>

    <div class="actions">
      <button id="leave" onclick="history.back()">Go Back (Recommended)</button>
      <button id="allow">Advanced: Proceed to unsafe site</button>
    </div>

    <div id="bytes">${bytes}</div>
  </div>

  <script>
    let bytes = document.getElementById('bytes').textContent;
    let button = document.getElementById('allow');
    if (bytes.length) {
      button.onclick = function () {
        if (!confirm("Are you sure you want to visit this unsafe site?")) return;
        let xhr = new XMLHttpRequest();
        xhr.open('POST', 'chrome:allowcert');
        xhr.onloadend = function () {
          location.reload(true);
        };
        xhr.send("${secret}&${bytes}");
      };
    } else {
      button.style.display = "none";
    }
  </script>
</body>

</html>
