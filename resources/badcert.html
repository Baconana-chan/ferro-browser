<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferro — Certificate Warning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .container { max-width: 500px; width: 100%; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    .reason { 
      opacity: 0.8; 
      margin-bottom: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      text-align: left;
    }
    .buttons { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    #leave {
      background: #3b82f6;
      color: white;
    }
    #leave:hover { background: #2563eb; }
    #allow {
      background: transparent;
      border: 1px solid rgba(128,128,128,0.3);
    }
    #allow:hover { background: rgba(128,128,128,0.1); }
    #bytes {
      margin-top: 1.5rem;
      padding: 0.5rem;
      font-size: 0.625rem;
      font-family: monospace;
      word-break: break-all;
      opacity: 0.4;
      display: none;
    }
    @media (prefers-color-scheme: light) {
      body { background: #fffbeb; color: #92400e; }
      .reason { background: #fef3c7; }
      #allow { color: #92400e; }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1917; color: #fbbf24; }
      .reason { background: #292524; }
      #allow { color: #fbbf24; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔓</div>
    <h1>Connection is not secure</h1>
    <div class="reason">${reason}</div>
    <div class="buttons">
      <button id="leave" onclick="history.back()">Go Back</button>
      <button id="allow">Proceed Anyway</button>
    </div>
    <div id="bytes">${bytes}</div>
  </div>
  <script>
    let bytes = document.getElementById('bytes').textContent;
    let button = document.getElementById('allow');
    if (bytes.length) {
      button.onclick = function() {
        let xhr = new XMLHttpRequest();
        xhr.open('POST', 'chrome:allowcert');
        xhr.onloadend = function() {
          location.reload(true);
        };
        xhr.send("${secret}&${bytes}");
      };
    } else {
      button.style.display = "none";
    }
  </script>
</body>
</html>
